<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <link rel="stylesheet" href="recursos/css/estilos.css">

    <script>
        function escribir(digito) {
            document.getElementById('pantalla').value += digito;
        }
        function calcular() {
            var calculo=document.getElementById('pantalla').value;
            document.getElementById('pantalla').value = eval(calculo);
        }
        function eliminar() {
            document.getElementById('pantalla').value="";
        }
    </script>
    <title>Calculadora</title>
</head>
<body>
    
    <div class="container-sm" style="width: 400px;">
        <table class="table colorCalculadora">
            <thead class="separador">
                <tr>
                    <th colspan="4"><h3 class="centrarTitulo">CALCULADORA</h3></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="4" class="separador">
                        <input class="pantalla" id="pantalla" type="text" readonly>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button type="button" onClick="escribir(7)" class="btn btn-primary">7</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir(8)" class="btn btn-primary">8</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir(9)" class="btn btn-primary">9</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir('/')" class="btn btn-primary">/</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button type="button" onClick="escribir(4)" class="btn btn-primary">4</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir(5)" class="btn btn-primary">5</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir(6)" class="btn btn-primary">6</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir('*')" class="btn btn-primary">*</button>
                    </td>  
                </tr>
                <tr>
                    <td>
                        <button type="button" onClick="escribir(1)" class="btn btn-primary">1</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir(2)" class="btn btn-primary">2</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir(3)" class="btn btn-primary">3</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir('-')" class="btn btn-primary">-</button>
                    </td>  
                </tr>
                <tr>
                    <td>
                        <button type="button" onClick="0" class="btn btn-primary">0</button>
                    </td>
                    <td>
                        <button type="button" onClick="calcular()" class="btn btn-primary">=</button>
                    </td>
                    <td>
                        <button type="button" onClick="eliminar()" class="btn btn-primary">CE</button>
                    </td>
                    <td>
                        <button type="button" onClick="escribir('+')" class="btn btn-primary">+</button>
                    </td>  
                </tr>
            </tbody>
        </table>
    </div>

<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>

</body>
</html>
